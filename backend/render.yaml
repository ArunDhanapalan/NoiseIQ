# Render build & start configuration for FastAPI Backend
services:
  - type: web
    name: noiseiq-backend
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
